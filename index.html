<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>authentic.me</title>
<link href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css" rel="stylesheet">
<style>
  /* ── CSS VARIABLES ── */
  :root {
    /* Text contrast scale — default: white */
    --text-bright: rgba(255,255,255,1);
    --text-visible: rgba(255,255,255,0.8);
    --text-muted: rgba(255,255,255,0.5);
    --text-subtle: rgba(255,255,255,0.3);
    --text-ghost: rgba(255,255,255,0.08);

    /* Theme overlay — default black */
    --overlay-color: rgb(0, 0, 0);

    /* Accent colors */
    --color-teal: #61CCBA;
    --color-blue: #70ACEB;
    --color-yellow: #F5C251;
    --color-red: #E97787;
  }

  /* ── RESET ── */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { max-width: 100vw; }

  body {
    background: #0a0a0a;
    font-family: 'Helvetica Neue', 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    max-width: 100vw;
  }

  /* ── BACKGROUND LAYERS ── */
  .bg-layer {
    position: fixed;
    inset: 0;
    background: url('images/Background/ground_background.webp') center/cover no-repeat;
    opacity: 0.25;
    z-index: 0;
  }

  .color-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay-color);
    pointer-events: none;
    z-index: 1;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 220px;
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 10;
    border-right: 1px solid var(--text-ghost);
  }

  .sidebar-card {
    padding: 3px 0;
    cursor: pointer;
    border-bottom: 1px solid var(--text-ghost);
    transition: all 0.3s ease-out;
    text-align: left;
    text-decoration: none;
    display: block;
  }

  .sidebar-card:first-child {
    border-top: 1px solid var(--text-ghost);
  }

  .sidebar-card.active .sidebar-label {
    color: var(--text-bright);
  }

  .sidebar-label {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-muted);
    transition: color 0.3s ease-out;
  }

  .sidebar-card:hover .sidebar-label {
    color: var(--text-visible);
  }

  /* ── SIDEBAR FOOTER ── */
  .sidebar-footer {
    position: absolute;
    bottom: 20px;
    left: 30px;
    font-size: 11px;
    font-weight: 300;
    color: var(--text-subtle);
    cursor: pointer;
    text-decoration: none;
    transition: color 0.3s ease-out;
    user-select: none;
  }

  .sidebar-footer:hover {
    color: var(--text-muted);
  }

  /* ── THEME PICKER MODAL ── */
  .theme-picker {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    z-index: 20;
    display: none;
    background: var(--modal-bg, rgba(0,0,0,0.85));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--text-ghost);
    border-radius: 12px;
    padding: 16px;
    cursor: default;
  }

  .theme-picker.open {
    display: block;
  }

  .theme-picker-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    cursor: move;
    user-select: none;
  }

  .theme-picker-title {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .theme-picker-close {
    font-size: 16px;
    color: var(--text-subtle);
    cursor: pointer;
    transition: color 0.2s;
    line-height: 1;
  }

  .theme-picker-close:hover {
    color: var(--text-bright);
  }

  .theme-reset {
    font-size: 10px;
    font-weight: 400;
    color: var(--text-subtle);
    cursor: pointer;
    text-align: right;
    margin-bottom: 6px;
    transition: color 0.2s ease-out;
  }

  .theme-reset:hover {
    color: var(--text-visible);
  }

  .theme-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-bottom: 10px;
  }

  .theme-swatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 4px;
    border: 1px solid var(--text-subtle);
    cursor: pointer;
    transition: all 0.2s ease-out;
  }

  .theme-swatch:hover {
    border-color: var(--text-visible);
  }

  .theme-swatch.active {
    border-color: var(--text-bright);
    box-shadow: 0 0 0 2px var(--text-ghost);
  }

  /* Text mode toggle */
  .text-mode-toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
  }

  .text-mode-btn {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid var(--text-subtle);
    background: none;
    cursor: pointer;
    transition: all 0.2s ease-out;
    font-family: inherit;
    flex: 1;
    text-align: center;
  }

  .text-mode-btn[data-mode="white"] {
    color: rgba(255,255,255,0.5);
  }

  .text-mode-btn[data-mode="black"] {
    color: rgba(0,0,0,0.5);
  }

  .text-mode-btn.active {
    border-color: var(--text-bright);
  }

  .text-mode-btn.active[data-mode="white"] {
    color: #fff;
  }

  .text-mode-btn.active[data-mode="black"] {
    color: #000;
  }

  /* Background thumbnails */
  .bg-thumbs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin-top: 8px;
  }

  .bg-thumb {
    aspect-ratio: 1;
    border-radius: 3px;
    border: 1px solid var(--text-subtle);
    background-size: cover;
    background-position: center;
    cursor: pointer;
    transition: all 0.2s ease-out;
  }

  .bg-thumb:hover {
    border-color: var(--text-visible);
  }

  .bg-thumb.active {
    border-color: var(--text-bright);
    box-shadow: 0 0 0 1px var(--text-ghost);
  }

  /* Sliders */
  .slider-control {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .slider-label {
    font-size: 10px;
    color: var(--text-subtle);
    width: 32px;
  }

  .theme-range {
    -webkit-appearance: none;
    appearance: none;
    width: 80px;
    height: 2px;
    background: var(--text-subtle);
    outline: none;
    border-radius: 2px;
    cursor: pointer;
  }

  .theme-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text-bright);
    cursor: pointer;
  }

  .theme-range::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text-bright);
    cursor: pointer;
    border: none;
  }

  .slider-value {
    font-size: 13px;
    color: var(--text-subtle);
    min-width: 36px;
    text-align: center;
  }



  /* ── LOGO ── */
  .logo {
    color: var(--text-bright);
    position: fixed;
    top: 30px;
    left: 30px;
    z-index: 15;
  }

  .logo svg {
    height: 64px;
    width: auto;
  }

  /* ── SIDEBAR NAV FADE ── */
  .sidebar.nav-hidden .sidebar-card,
  .sidebar.nav-hidden .sidebar-footer {
    opacity: 0;
    transition: opacity 0.4s ease-out;
  }

  .sidebar:not(.nav-hidden) .sidebar-card,
  .sidebar:not(.nav-hidden) .sidebar-footer {
    opacity: 1;
    transition: opacity 0.4s ease-out;
  }

  /* ── HERO ── */
  #programHero {
    position: relative;
    z-index: 2;
    margin-left: -220px;
    width: 100vw;
  }

  .hero-section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    position: relative;
  }

  .hero-primary {
    font-size: 48px;
    font-weight: 500;
    color: var(--text-bright);
    line-height: 1.15;
    margin-bottom: 40px;
    max-width: 900px;
  }

  .hero-secondary {
    font-size: 20px;
    font-weight: 300;
    color: var(--text-muted);
    line-height: 180%;
    margin-bottom: 40px;
  }

  .hero-supporting {
    font-size: 18px;
    font-weight: 300;
    color: var(--text-visible);
    line-height: 180%;
    margin-bottom: 40px;
  }

  .mobile-br { display: none; }

  .scroll-arrow {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    cursor: pointer;
    color: var(--color-teal);
    animation: pulse-bounce 2s ease-in-out infinite;
  }

  .scroll-arrow svg {
    width: 32px;
    height: 32px;
  }

  @keyframes pulse-bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 1; }
    50% { transform: translateX(-50%) translateY(10px); opacity: 0.5; }
  }

  @media (max-width: 768px) {
    .logo {
      display: none;
    }

    .hero-primary {
      font-size: 28px;
    }

    .mobile-br { display: inline; }
    .desktop-br { display: none; }
    .hero-primary br:not(.mobile-br) { display: none; }

    .hero-secondary {
      font-size: 16px;
    }

    .hero-supporting {
      font-size: 15px;
    }

    #programHero {
      margin-left: 0;
      width: 100%;
    }

    .hero-section {
      padding: 20px;
    }
  }

  /* ── PROGRAM PAGE ── */
  .program-scroll {
    position: relative;
    z-index: 2;
    padding-bottom: 120px;
  }

  .program-anchor {
    margin-left: 110px;
    margin-right: 40px;
  }

  .program-hero {
    min-height: 88vh;
    max-width: 760px;
    padding: 120px 0 80px;
    display: flex;
    flex-direction: column;
  }

  .program-hero h1 {
    font-size: 64px;
    font-weight: 500;
    color: var(--text-bright);
    line-height: 1.05;
    margin-bottom: 24px;
  }

  .program-meta {
    font-size: 17px;
    font-weight: 400;
    color: #5FBFAB;
    margin-bottom: 16px;
  }

  .program-primary {
    font-size: 28px;
    font-weight: 400;
    color: var(--text-bright);
    line-height: 1.3;
    margin-bottom: 24px;
  }

  .program-secondary {
    font-size: 18px;
    font-weight: 400;
    color: var(--text-bright);
    opacity: 0.75;
    line-height: 1.5;
    margin-bottom: 40px;
  }

  .program-divider {
    width: 100%;
    height: 1px;
    background: var(--text-ghost);
    margin: 32px 0;
  }

  .section-2 {
    max-width: 1120px;
    padding: 120px 0;
  }

  .section-label {
    font-size: 14px;
    font-weight: 500;
    color: #5FBFAB;
    margin-bottom: 16px;
  }

  .section-heading {
    font-size: 42px;
    font-weight: 500;
    color: var(--text-bright);
    line-height: 1.05;
    margin-bottom: 32px;
    max-width: 1000px;
  }

  .section-intro {
    font-size: 18px;
    font-weight: 400;
    color: var(--text-bright);
    opacity: 0.8;
    line-height: 1.5;
    margin-bottom: 80px;
    max-width: 760px;
  }

  .sub-heading {
    font-size: 30px;
    font-weight: 500;
    color: var(--text-bright);
    line-height: 1.2;
    margin-top: 80px;
    margin-bottom: 32px;
    max-width: 760px;
  }

  .body-text {
    font-size: 15px;
    max-width: 760px;
    font-weight: 400;
    color: var(--text-visible);
    line-height: 1.8;
    margin-bottom: 16px;
  }

  .body-text p { margin-bottom: 16px; }

  .emphasis-text {
    font-size: 23px;
    max-width: 760px;
    font-weight: 400;
    color: var(--text-bright);
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .comparison {
    display: flex;
    gap: 0;
    margin-bottom: 32px;
  }

  .comparison-col {
    flex: 1;
    max-width: 440px;
  }

  .comparison-col:first-child {
    padding-right: 40px;
    border-right: 1px solid var(--text-ghost);
  }

  .comparison-col:last-child {
    padding-left: 40px;
  }

  .comparison-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-bright);
    margin-bottom: 16px;
  }

  .comparison-body {
    font-size: 15px;
    font-weight: 400;
    color: var(--text-visible);
    line-height: 1.8;
  }

  .comparison-body p { margin-bottom: 16px; }

  /* ── ARROW BULLETS ── */
  .arrow-bullet {
    display: flex;
    gap: 0.4em;
    margin-bottom: 4px;
    color: var(--text-visible);
  }

  .arrow-bullet span:first-child {
    flex-shrink: 0;
  }

  /* ── TWO COLUMN SECTION ── */
  .split-section {
    display: flex;
    align-items: center;
    gap: 16px;
    max-width: 1120px;
    padding: 120px 0;
  }

  .split-left {
    flex: 1;
    max-width: 520px;
  }

  .split-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    position: relative;
  }

  .donut-preview {
    position: relative;
    width: 100%;
    max-width: 500px;
  }

  .donut-center-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 42%;
    height: 42%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-visible);
    text-decoration: none;
    text-align: center;
    line-height: 1.4;
    cursor: pointer;
    transition: transform 1.2s ease-in-out, color 1.2s ease-in-out;
  }

  .donut-center-btn:hover {
    transform: translate(-50%, -50%) scale(1.15);
    color: var(--text-bright);
  }

  .donut-ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(97,204,186,0.8);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    pointer-events: none;
    animation: donut-ripple-out 3s ease-out forwards;
  }

  @keyframes donut-ripple-out {
    0% { width: 20px; height: 20px; opacity: 1; transform: translate(-50%, -50%) scale(0); }
    40% { opacity: 0.5; }
    100% { width: 500px; height: 500px; opacity: 0; transform: translate(-50%, -50%) scale(1); }
  }

  @keyframes donut-wobble {
    0% { transform: translate(-50%,-50%) scale(1, 1); }
    10% { transform: translate(-50%,-50%) scale(1.15, 1.05); }
    25% { transform: translate(-50%,-50%) scale(1.05, 1.18); }
    40% { transform: translate(-50%,-50%) scale(1.18, 1.05); }
    55% { transform: translate(-50%,-50%) scale(1.05, 1.15); }
    70% { transform: translate(-50%,-50%) scale(1.15, 1.05); }
    85% { transform: translate(-50%,-50%) scale(1.05, 1.10); }
    100% { transform: translate(-50%,-50%) scale(1, 1); }
  }

  /* ── CARD EXPAND PANEL ── */
  .card-expand {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s ease-out, padding 0.3s ease-out;
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 0 24px;
    margin-top: 0;
  }

  .card-expand.open {
    max-height: 2000px;
    border-color: var(--text-ghost);
    padding: 24px;
    margin-top: 16px;
  }

  .card-expand-close {
    font-size: 12px;
    color: var(--text-subtle);
    cursor: pointer;
    float: right;
    transition: color 0.2s;
  }

  .card-expand-close:hover {
    color: var(--text-bright);
  }

  .practice-card.active {
    border-color: var(--text-muted);
  }

  /* ── TIMELINE ── */
  .timeline-bar {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin-bottom: 0;
  }

  .timeline-segment {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .timeline-time {
    font-size: 13px;
    color: var(--text-visible);
    opacity: 0.5;
    margin-bottom: 6px;
  }

  .timeline-color {
    height: 6px;
    border-radius: 3px;
    width: 100%;
  }

  .timeline-label {
    font-size: 13px;
    color: var(--text-visible);
    opacity: 0.7;
    margin-top: 6px;
  }

  .timeline-duration {
    font-size: 11px;
    color: var(--text-visible);
    opacity: 0.4;
  }

  .timeline-note {
    text-align: center;
    font-size: 14px;
    color: var(--text-visible);
    opacity: 0.6;
    padding: 24px 0;
  }

  .timeline-meta {
    text-align: center;
    font-size: 13px;
    color: var(--text-visible);
    opacity: 0.4;
    padding-bottom: 32px;
  }

  /* Practice cards */
  .practice-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 32px;
  }

  .practice-card {
    border: 1px solid var(--text-ghost);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .practice-card-icon {
    width: 20px;
    height: 20px;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  .practice-card-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-bright);
  }

  .practice-card-duration {
    font-size: 13px;
    font-weight: 400;
    opacity: 0.6;
  }

  .practice-card-desc {
    font-size: 14px;
    color: var(--text-visible);
    opacity: 0.7;
    line-height: 1.5;
    margin-top: 4px;
  }

  .practice-card-link {
    font-size: 13px;
    font-weight: 400;
    color: var(--color-teal);
    text-decoration: none;
    margin-top: auto;
    padding-top: 8px;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .practice-card-link:hover {
    opacity: 0.7;
  }

  /* Mobile timeline */
  .timeline-mobile {
    display: none;
    flex-direction: column;
    gap: 0;
  }

  .timeline-mobile-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
  }

  .timeline-mobile-bar {
    width: 4px;
    height: 40px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .timeline-mobile-info {
    display: flex;
    flex-direction: column;
  }

  .timeline-mobile-label {
    font-size: 15px;
    font-weight: 400;
    color: var(--text-visible);
  }

  .timeline-mobile-time {
    font-size: 12px;
    color: var(--text-visible);
    opacity: 0.4;
  }

  @media (max-width: 768px) {
    .timeline-bar { display: none; }
    .timeline-mobile { display: flex; }
    .practice-cards { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 480px) {
    .practice-cards { grid-template-columns: 1fr; }
  }

  /* ── MOVEMENT ICONS ── */
  .movement-icon {
    filter: brightness(0) saturate(100%) invert(62%) sepia(30%) saturate(800%) hue-rotate(310deg) brightness(95%) contrast(95%);
  }

  .movement-chapter {
    cursor: pointer;
    margin-top: 16px;
  }

  .movement-chapter-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .movement-chapter-toggle {
    margin-left: auto;
    font-size: 18px;
    color: var(--text-subtle);
    transition: transform 0.3s ease-out;
  }

  .movement-chapter.open .movement-chapter-toggle {
    transform: rotate(45deg);
  }

  .movement-chapter-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease-out;
    padding-left: 44px;
  }

  .movement-chapter.open .movement-chapter-body {
    max-height: 300px;
  }

  /* ── NEEDS PAGE ── */
  .needs-col-left {
    flex: 1;
    min-width: 0;
    padding: 0 40px;
    max-width: 560px;
  }

  .needs-title {
    font-size: 32px;
    font-weight: 400;
    color: var(--text-bright);
    margin: 60px 0 40px;
  }

  .needs-question-list {
    padding: 0 0 60px;
  }

  .needs-col-right {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .needs-donut-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  .needs-center-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: 300;
    line-height: 0.9;
    color: var(--text-muted);
    text-align: center;
  }

  .needs-question {
    margin-bottom: 48px;
    padding-left: 16px;
    border-left: 2px solid #E97787;
    transition: border-color 0.3s ease-out;
  }

  .needs-question.answered {
    border-left-color: #61CCBA;
  }

  .needs-q-prompt {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-bright);
    margin-bottom: 16px;
  }

  .needs-q-statement {
    font-size: 15px;
    font-weight: 300;
    color: var(--text-visible);
    line-height: 170%;
    margin-bottom: 6px;
  }

  .needs-score-slider {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .needs-score-slider-track {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .needs-score-dot {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid;
    cursor: pointer;
    transition: all 0.3s ease-out;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 400;
    position: relative;
  }

  .needs-score-dot:hover {
    border-color: var(--text-bright) !important;
  }

  .needs-score-dot:hover .needs-score-dot-label {
    color: var(--text-bright) !important;
  }

  .needs-score-dot.active {
    background: rgba(97,204,186,0.15);
    border-color: #61CCBA !important;
  }

  .needs-score-dot.active .needs-score-dot-label {
    color: #61CCBA !important;
  }

  .needs-score-dot-label {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 6px;
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
    white-space: nowrap;
    cursor: pointer;
  }

  .needs-score-connector {
    width: 16px;
    height: 1px;
    background: var(--text-subtle);
  }

  @media (max-width: 768px) {
    #content.needs-layout {
      flex-direction: column;
    }

    .needs-col-left {
      max-width: 100%;
      padding: 0 20px;
    }

    .needs-title {
      font-size: 28px;
      margin: 30px 0 24px;
    }

    .needs-col-right {
      position: relative;
      height: auto;
      min-height: 400px;
      padding: 20px;
      order: -1;
    }
  }

  /* ── CONTENT CONTAINER ── */
  #content {
    position: relative;
    margin-left: 220px;
    width: calc(100vw - 220px);
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 2;
  }

  /* ── MOBILE TOP BAR ── */
  .topbar {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    z-index: 12;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
  }

  .hamburger {
    width: 24px;
    height: 24px;
    cursor: pointer;
    color: var(--text-bright);
    flex-shrink: 0;
  }

  .topbar-logo {
    color: var(--text-bright);
    height: 28px;
  }

  .topbar-logo svg {
    height: 100%;
    width: auto;
  }

  /* ── SIDEBAR OVERLAY (mobile) ── */
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 9;
  }

  .sidebar-backdrop.open {
    display: block;
  }

  /* ── MOBILE BREAKPOINT ── */
  @media (max-width: 768px) {
    .topbar {
      display: flex;
    }

    body {
      display: block;
    }

    .sidebar:not(.open) {
      display: none !important;
    }

    .sidebar.open {
      display: flex !important;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 220px;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 11;
    }

    #content {
      margin-left: 0;
      width: 100%;
      padding-top: 56px;
      overflow-x: hidden;
    }

    .program-anchor {
      margin-left: 20px;
      margin-right: 20px;
    }

    .program-hero h1 {
      font-size: 36px;
    }

    .program-hero {
      padding: 60px 0 40px;
      min-height: auto;
    }

    .section-heading {
      font-size: 28px;
      max-width: 100%;
    }

    .sub-heading {
      font-size: 22px;
      max-width: 100%;
    }

    .section-intro {
      max-width: 100%;
      margin-bottom: 40px;
    }

    .body-text,
    .emphasis-text {
      max-width: 100%;
    }

    .emphasis-text {
      font-size: 19px;
    }

    .comparison {
      flex-direction: column;
      gap: 32px;
    }

    .comparison-col {
      max-width: 100%;
    }

    .comparison-col:first-child {
      padding-right: 0;
      border-right: none;
      border-bottom: 1px solid var(--text-ghost);
      padding-bottom: 32px;
    }

    .comparison-col:last-child {
      padding-left: 0;
    }

    .section-2 {
      padding: 60px 0;
    }

    .program-secondary {
      font-size: 16px;
      margin-bottom: 24px;
    }

    .program-primary {
      font-size: 22px;
    }

    .split-section {
      flex-direction: column;
      gap: 16px;
      padding: 60px 0;
    }

    .split-left {
      max-width: 100%;
    }

    .split-right {
      width: calc(100% + 40px);
      margin-left: -20px;
      margin-right: -20px;
    }

    .donut-preview {
      max-width: 100%;
    }
  }

</style>
</head>
<body>

  <!-- Background layers -->
  <div class="bg-layer" id="bgLayer"></div>
  <div class="color-overlay" id="colorOverlay"></div>

  <!-- Mobile top bar -->
  <div class="topbar">
    <svg class="hamburger" id="hamburger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="4" y1="6" x2="20" y2="6"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="18" x2="20" y2="18"/>
    </svg>
    <div class="topbar-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1326 469">
        <path d="M 29 256 C 91 218, 155 183, 213 169 C 233 164, 252 164, 273 168 C 288 171, 300 175, 314 180" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 13"/>
        <path d="M 213 169 C 235 151, 252 133, 263 113 C 272 96, 276 76, 278 43" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 13"/>
        <text x="143" y="329" fill="currentColor" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="158" font-weight="700" letter-spacing="-5" textLength="1185" lengthAdjust="spacingAndGlyphs">authentic.me</text>

  <!-- Sidebar backdrop (mobile) -->

  <!-- Logo (always visible) -->
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1326 469">
      <path d="M 29 256 C 91 218, 155 183, 213 169 C 233 164, 252 164, 273 168 C 288 171, 300 175, 314 180" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 13"/>
      <path d="M 213 169 C 235 151, 252 133, 263 113 C 272 96, 276 76, 278 43" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 13"/>
      <text x="143" y="329" fill="currentColor" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="158" font-weight="700" letter-spacing="-5" textLength="1185" lengthAdjust="spacingAndGlyphs">authentic.me</text>
    </svg>
  </div>

  <!-- Sidebar navigation -->
  <nav class="sidebar">
    <a class="sidebar-card active" href="#/" data-route="/">
      <div class="sidebar-label">Introduction</div>
    </a>
    <a class="sidebar-card" href="#/how" data-route="/how">
      <div class="sidebar-label">How</div>
    </a>
    <a class="sidebar-card" href="#/needs" data-route="/needs">
      <div class="sidebar-label">Your Needs</div>
    </a>
    <a class="sidebar-card" href="#/program" data-route="/program">
      <div class="sidebar-label">The Program</div>
    </a>

    <!-- Footer: brand name, toggles theme picker -->
    <span class="sidebar-footer" id="themeToggle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3v18"/>
        <path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none"/>
      </svg>
    </span>
  </nav>

  <!-- Theme picker -->
  <div class="theme-picker" id="themePicker">
    <div class="theme-picker-header" id="themePickerHeader">
      <span class="theme-picker-title">Theme</span>
      <span class="theme-picker-close" id="themePickerClose">&times;</span>
    </div>
    <div class="theme-reset" onclick="resetTheme()">Reset</div>
    <div class="theme-grid" id="themeGrid"></div>
    <div class="slider-control">
      <div class="slider-label">Filter</div>
      <input type="range" class="theme-range" id="overlayRange" min="0" max="100" value="94" oninput="setOverlayOpacity(this.value)">
      <div class="slider-value" id="overlayPct">94%</div>
    </div>
    <div class="slider-control">
      <div class="slider-label">Image</div>
      <input type="range" class="theme-range" id="bgRange" min="0" max="100" value="25" oninput="setBgOpacity(this.value)">
      <div class="slider-value" id="bgPct">25%</div>
    </div>
    <div class="bg-thumbs" id="bgThumbs"></div>
    <div class="text-mode-toggle">
      <button class="text-mode-btn active" data-mode="white" onclick="setTextMode('white')">A</button>
      <button class="text-mode-btn" data-mode="black" onclick="setTextMode('black')">A</button>
    </div>
  </div>

  <!-- Content container -->
  <div id="content"></div>

<script src="js/donut.js"></script>
<script src="pages/program.js"></script>
<script src="pages/needs.js"></script>
<script>
// ────────────────────────────────────────
// Theme colors: default teal + 12 hue-spaced
// ────────────────────────────────────────
var themeColors = [
  { r: 0,   g: 0,   b: 0,   name: 'Default' },      // black
  { r: 11,  g: 61,  b: 54,  name: 'Teal' },         // ~170 deg
  { r: 61,  g: 28,  b: 11,  name: 'Vermilion' },   // 30
  { r: 61,  g: 45,  b: 11,  name: 'Amber' },       // 60
  { r: 50,  g: 61,  b: 11,  name: 'Lime' },        // 90
  { r: 28,  g: 61,  b: 11,  name: 'Green' },       // 120
  { r: 11,  g: 61,  b: 28,  name: 'Emerald' },     // 150
  { r: 11,  g: 45,  b: 61,  name: 'Cyan' },        // 210
  { r: 11,  g: 28,  b: 61,  name: 'Blue' },        // 240
  { r: 28,  g: 11,  b: 61,  name: 'Indigo' },      // 270
  { r: 45,  g: 11,  b: 61,  name: 'Violet' },      // 300
  { r: 61,  g: 11,  b: 45,  name: 'Magenta' }      // 330
];

// ────────────────────────────────────────
// Background images
// ────────────────────────────────────────
var backgrounds = [
  { file: 'images/Background/ground_background.webp', name: 'Default' },
  { file: 'images/Background/Background1.png', name: 'Bg 1' },
  { file: 'images/Background/Background2.png', name: 'Bg 2' },
  { file: 'images/Background/Background3.png', name: 'Bg 3' },
  { file: 'images/Background/Background4.png', name: 'Bg 4' },
  { file: 'images/Background/Background5.png', name: 'Bg 5' },
  { file: 'images/Background/Background6.png', name: 'Bg 6' },
  { file: 'images/Background/Background7.png', name: 'Bg 7' },
  { file: 'images/Background/Background8.png', name: 'Bg 8' },
];

// ────────────────────────────────────────
// DOM references
// ────────────────────────────────────────
var bgLayer = document.getElementById('bgLayer');
var colorOverlay = document.getElementById('colorOverlay');
var themePicker = document.getElementById('themePicker');
var themeGrid = document.getElementById('themeGrid');

// ────────────────────────────────────────
// State — load from localStorage
// ────────────────────────────────────────
var state = {
  themeIndex: parseInt(localStorage.getItem('am_theme') || '0'),
  textMode: localStorage.getItem('am_text_mode') || 'white',
  overlayOpacity: parseInt(localStorage.getItem('am_overlay_opacity') || '94'),
  bgOpacity: parseInt(localStorage.getItem('am_bg_opacity') || '25'),
  bgIndex: parseInt(localStorage.getItem('am_bg') || '0')
};

// ────────────────────────────────────────
// Theme color swatches
// ────────────────────────────────────────
themeColors.forEach(function(color, i) {
  var swatch = document.createElement('div');
  swatch.className = 'theme-swatch' + (i === state.themeIndex ? ' active' : '');
  swatch.style.background = 'rgb(' + color.r + ',' + color.g + ',' + color.b + ')';
  swatch.setAttribute('data-index', i);
  swatch.addEventListener('click', function() { setThemeColor(i); });
  themeGrid.appendChild(swatch);
});

// ────────────────────────────────────────
// Theme color
// ────────────────────────────────────────
function setThemeColor(index) {
  state.themeIndex = index;
  var c = themeColors[index];
  document.documentElement.style.setProperty('--overlay-color', 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')');
  localStorage.setItem('am_theme', index);

  // Update active swatch
  document.querySelectorAll('.theme-swatch').forEach(function(el, i) {
    el.classList.toggle('active', i === index);
  });
}

// ────────────────────────────────────────
// Text mode (white / black)
// ────────────────────────────────────────
function setTextMode(mode) {
  state.textMode = mode;
  var base = mode === 'white' ? '255,255,255' : '0,0,0';
  document.documentElement.style.setProperty('--text-bright',  'rgba(' + base + ',1)');
  document.documentElement.style.setProperty('--text-visible', 'rgba(' + base + ',0.8)');
  document.documentElement.style.setProperty('--text-muted',   'rgba(' + base + ',0.5)');
  document.documentElement.style.setProperty('--text-subtle',  'rgba(' + base + ',0.3)');
  document.documentElement.style.setProperty('--text-ghost',   'rgba(' + base + ',0.08)');
  var modalBg = mode === 'white' ? 'rgba(0,0,0,0.85)' : 'rgba(255,255,255,0.85)';
  document.documentElement.style.setProperty('--modal-bg', modalBg);
  localStorage.setItem('am_text_mode', mode);

  // Update toggle buttons
  document.querySelectorAll('.text-mode-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
  });
}

// ────────────────────────────────────────
// Overlay opacity
// ────────────────────────────────────────
function setOverlayOpacity(val) {
  state.overlayOpacity = parseInt(val);
  colorOverlay.style.opacity = state.overlayOpacity / 100;
  document.getElementById('overlayPct').textContent = state.overlayOpacity + '%';
  document.getElementById('overlayRange').value = state.overlayOpacity;
  localStorage.setItem('am_overlay_opacity', state.overlayOpacity);
}

// ────────────────────────────────────────
// Background image opacity
// ────────────────────────────────────────
function setBgOpacity(val) {
  state.bgOpacity = parseInt(val);
  bgLayer.style.opacity = state.bgOpacity / 100;
  document.getElementById('bgPct').textContent = state.bgOpacity + '%';
  document.getElementById('bgRange').value = state.bgOpacity;
  localStorage.setItem('am_bg_opacity', state.bgOpacity);
}

// ────────────────────────────────────────
// Background image selector (thumbnails)
// ────────────────────────────────────────
var bgThumbs = document.getElementById('bgThumbs');

function buildBgThumbs() {
  bgThumbs.innerHTML = '';
  backgrounds.forEach(function(bg, i) {
    var thumb = document.createElement('div');
    thumb.className = 'bg-thumb' + (i === state.bgIndex ? ' active' : '');
    thumb.style.backgroundImage = "url('" + bg.file + "')";
    thumb.addEventListener('click', function() { selectBg(i); });
    bgThumbs.appendChild(thumb);
  });
}

function selectBg(index) {
  state.bgIndex = index;
  bgLayer.style.backgroundImage = "url('" + backgrounds[index].file + "')";
  localStorage.setItem('am_bg', index);
  document.querySelectorAll('.bg-thumb').forEach(function(el, i) {
    el.classList.toggle('active', i === index);
  });
}

function applyBg() {
  bgLayer.style.backgroundImage = "url('" + backgrounds[state.bgIndex].file + "')";
  localStorage.setItem('am_bg', state.bgIndex);
}

buildBgThumbs();

// ────────────────────────────────────────
// Theme picker modal
// ────────────────────────────────────────
function openThemePicker() {
  themePicker.classList.add('open');
}

function closeThemePicker() {
  themePicker.classList.remove('open');
}

document.getElementById('themeToggle').addEventListener('click', function(e) {
  e.stopPropagation();
  if (themePicker.classList.contains('open')) closeThemePicker();
  else openThemePicker();
});

document.getElementById('themePickerClose').addEventListener('click', closeThemePicker);

// Close theme picker when clicking outside
document.addEventListener('click', function(e) {
  if (themePicker.classList.contains('open') && !themePicker.contains(e.target)) {
    closeThemePicker();
  }
});

// Dragging
var dragHeader = document.getElementById('themePickerHeader');
var isDragging = false;
var dragOffsetX = 0, dragOffsetY = 0;

dragHeader.addEventListener('mousedown', function(e) {
  if (e.target.id === 'themePickerClose') return;
  isDragging = true;
  var rect = themePicker.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  themePicker.style.transform = 'none';
  themePicker.style.left = rect.left + 'px';
  themePicker.style.top = rect.top + 'px';
  e.preventDefault();
});

document.addEventListener('mousemove', function(e) {
  if (!isDragging) return;
  themePicker.style.left = (e.clientX - dragOffsetX) + 'px';
  themePicker.style.top = (e.clientY - dragOffsetY) + 'px';
});

document.addEventListener('mouseup', function() {
  isDragging = false;
});

// ────────────────────────────────────────
// ────────────────────────────────────────
// Reset to defaults
// ────────────────────────────────────────
function resetTheme() {
  setThemeColor(0);
  setTextMode('white');
  setOverlayOpacity(94);
  setBgOpacity(25);
  selectBg(0);
}

// Apply saved state on load
// ────────────────────────────────────────
setThemeColor(state.themeIndex);
setTextMode(state.textMode);
setOverlayOpacity(state.overlayOpacity);
setBgOpacity(state.bgOpacity);
applyBg();

// ────────────────────────────────────────
// Router
// ────────────────────────────────────────
var navLinks = document.querySelectorAll('.sidebar-card[data-route]');

function getRoute() {
  var hash = window.location.hash || '#/';
  // Strip the leading #
  return hash.substring(1) || '/';
}

function matchRoute(route) {
  // Returns { name, params } for the matched route
  if (route === '/' || route === '') return { name: 'intro', params: {} };
  if (route === '/how') return { name: 'how', params: {} };
  if (route === '/needs') return { name: 'needs', params: {} };
  if (route === '/program') return { name: 'program', params: {} };

  // /how/:dimension
  var howMatch = route.match(/^\/how\/([^\/]+)$/);
  if (howMatch) return { name: 'how-dimension', params: { dimension: howMatch[1] } };

  // /needs/:parent
  var needsParent = route.match(/^\/needs\/([^\/]+)$/);
  if (needsParent) return { name: 'needs-parent', params: { parent: needsParent[1] } };

  // /needs/:parent/:child
  var needsChild = route.match(/^\/needs\/([^\/]+)\/([^\/]+)$/);
  if (needsChild) return { name: 'needs-child', params: { parent: needsChild[1], child: needsChild[2] } };

  return { name: 'intro', params: {} };
}

function updateNav(route) {
  // Determine which top-level nav item to highlight
  var activeRoute = '/';
  if (route.startsWith('/how')) activeRoute = '/how';
  else if (route.startsWith('/needs')) activeRoute = '/needs';
  else if (route.startsWith('/program')) activeRoute = '/program';

  navLinks.forEach(function(link) {
    var linkRoute = link.getAttribute('data-route');
    link.classList.toggle('active', linkRoute === activeRoute);
  });
}

function renderRoute(match) {
  // Cleanup previous page nav
  if (window._cleanupProgramNav) {
    window._cleanupProgramNav();
    window._cleanupProgramNav = null;
  }

  var content = document.getElementById('content');
  content.classList.remove('needs-layout');
  content.style.display = '';
  content.style.flexDirection = '';
  if (content._needsCleanup) {
    content._needsCleanup();
    content._needsCleanup = null;
  }
  switch (match.name) {
    case 'program':
      renderProgram(content);
      break;
    case 'needs':
      content.classList.add('needs-layout');
      renderNeeds(content);
      break;
    default:
      content.innerHTML = '';
      break;
  }
}

function onRouteChange() {
  var route = getRoute();
  var match = matchRoute(route);
  updateNav(route);
  renderRoute(match);
}

window.addEventListener('hashchange', onRouteChange);
onRouteChange();

// ────────────────────────────────────────
// Mobile sidebar
// ────────────────────────────────────────
var sidebar = document.querySelector('.sidebar');
var sidebarBackdrop = document.getElementById('sidebarBackdrop');
var hamburger = document.getElementById('hamburger');

function openSidebar() {
  sidebar.classList.add('open');
  sidebarBackdrop.classList.add('open');
}

function closeSidebar() {
  sidebar.classList.remove('open');
  sidebarBackdrop.classList.remove('open');
}

hamburger.addEventListener('click', function() {
  if (sidebar.classList.contains('open')) closeSidebar();
  else openSidebar();
});

sidebarBackdrop.addEventListener('click', closeSidebar);

// Close sidebar on nav click (mobile)
document.querySelectorAll('.sidebar-card').forEach(function(card) {
  card.addEventListener('click', function() {
    if (window.innerWidth <= 768) closeSidebar();
  });
});

// Swipe to open/close
var touchStartX = 0;
var touchCurrentX = 0;
var swiping = false;

document.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  // Only start swipe from left edge (open) or when sidebar is open
  if (touchStartX < 30 || sidebar.classList.contains('open')) {
    swiping = true;
  }
});

document.addEventListener('touchmove', function(e) {
  if (!swiping) return;
  touchCurrentX = e.touches[0].clientX;
});

document.addEventListener('touchend', function() {
  if (!swiping) return;
  var diff = touchCurrentX - touchStartX;
  if (diff > 60 && !sidebar.classList.contains('open')) {
    openSidebar();
  } else if (diff < -60 && sidebar.classList.contains('open')) {
    closeSidebar();
  }
  swiping = false;
  touchCurrentX = 0;
});
</script>
</body>
