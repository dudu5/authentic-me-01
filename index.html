<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>authentic.me</title>
<link href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css" rel="stylesheet">
<style>
  /* ── CSS VARIABLES ── */
  :root {
    /* Text contrast scale — default: white */
    --text-bright: rgba(255,255,255,1);
    --text-visible: rgba(255,255,255,0.8);
    --text-muted: rgba(255,255,255,0.5);
    --text-subtle: rgba(255,255,255,0.3);
    --text-ghost: rgba(255,255,255,0.08);

    /* Theme overlay — default black */
    --overlay-color: rgb(0, 0, 0);

    /* Accent colors */
    --color-teal: #61CCBA;
    --color-blue: #70ACEB;
    --color-yellow: #F5C251;
    --color-red: #E97787;
  }

  /* ── RESET ── */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow: hidden; }

  body {
    background: #0a0a0a;
    font-family: 'Helvetica Neue', 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── BACKGROUND LAYERS ── */
  .bg-layer {
    position: fixed;
    inset: 0;
    background: url('images/Background/ground_background.webp') center/cover no-repeat;
    opacity: 0.25;
    z-index: 0;
  }

  .color-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay-color);
    pointer-events: none;
    z-index: 1;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 220px;
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 10;
    border-right: 1px solid var(--text-ghost);
  }

  .sidebar-card {
    padding: 14px 0;
    cursor: pointer;
    border-bottom: 1px solid var(--text-ghost);
    transition: all 0.3s ease-out;
    text-align: right;
    text-decoration: none;
    display: block;
  }

  .sidebar-card:first-child {
    border-top: 1px solid var(--text-ghost);
  }

  .sidebar-card.active .sidebar-label {
    color: var(--text-bright);
  }

  .sidebar-label {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-muted);
    transition: color 0.3s ease-out;
  }

  .sidebar-card:hover .sidebar-label {
    color: var(--text-visible);
  }

  /* ── SIDEBAR FOOTER ── */
  .sidebar-footer {
    position: absolute;
    bottom: 20px;
    left: 30px;
    font-size: 11px;
    font-weight: 300;
    color: var(--text-subtle);
    cursor: pointer;
    text-decoration: none;
    transition: color 0.3s ease-out;
    user-select: none;
  }

  .sidebar-footer:hover {
    color: var(--text-muted);
  }

  /* ── THEME PICKER MODAL ── */
  .theme-backdrop {
    position: fixed;
    inset: 0;
    z-index: 19;
    display: none;
  }

  .theme-backdrop.open {
    display: block;
  }

  .theme-picker {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    z-index: 20;
    display: none;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--text-ghost);
    border-radius: 12px;
    padding: 16px;
    cursor: default;
  }

  .theme-picker.open {
    display: block;
  }

  .theme-picker-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    cursor: move;
    user-select: none;
  }

  .theme-picker-title {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .theme-picker-close {
    font-size: 16px;
    color: var(--text-subtle);
    cursor: pointer;
    transition: color 0.2s;
    line-height: 1;
  }

  .theme-picker-close:hover {
    color: var(--text-bright);
  }

  .theme-reset {
    font-size: 10px;
    font-weight: 400;
    color: var(--text-subtle);
    cursor: pointer;
    text-align: right;
    margin-bottom: 6px;
    transition: color 0.2s ease-out;
  }

  .theme-reset:hover {
    color: var(--text-visible);
  }

  .theme-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-bottom: 10px;
  }

  .theme-swatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 4px;
    border: 1px solid var(--text-subtle);
    cursor: pointer;
    transition: all 0.2s ease-out;
  }

  .theme-swatch:hover {
    border-color: var(--text-visible);
  }

  .theme-swatch.active {
    border-color: var(--text-bright);
    box-shadow: 0 0 0 2px var(--text-ghost);
  }

  /* Text mode toggle */
  .text-mode-toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
  }

  .text-mode-btn {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid var(--text-subtle);
    background: none;
    cursor: pointer;
    transition: all 0.2s ease-out;
    font-family: inherit;
    flex: 1;
    text-align: center;
  }

  .text-mode-btn[data-mode="white"] {
    color: rgba(255,255,255,0.5);
  }

  .text-mode-btn[data-mode="black"] {
    color: rgba(0,0,0,0.5);
  }

  .text-mode-btn.active {
    border-color: var(--text-bright);
  }

  .text-mode-btn.active[data-mode="white"] {
    color: #fff;
  }

  .text-mode-btn.active[data-mode="black"] {
    color: #000;
  }

  /* Background thumbnails */
  .bg-thumbs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin-top: 8px;
  }

  .bg-thumb {
    aspect-ratio: 1;
    border-radius: 3px;
    border: 1px solid var(--text-subtle);
    background-size: cover;
    background-position: center;
    cursor: pointer;
    transition: all 0.2s ease-out;
  }

  .bg-thumb:hover {
    border-color: var(--text-visible);
  }

  .bg-thumb.active {
    border-color: var(--text-bright);
    box-shadow: 0 0 0 1px var(--text-ghost);
  }

  /* Sliders */
  .slider-control {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .slider-label {
    font-size: 10px;
    color: var(--text-subtle);
    width: 32px;
  }

  .theme-range {
    -webkit-appearance: none;
    appearance: none;
    width: 80px;
    height: 2px;
    background: var(--text-subtle);
    outline: none;
    border-radius: 2px;
    cursor: pointer;
  }

  .theme-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text-bright);
    cursor: pointer;
  }

  .theme-range::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text-bright);
    cursor: pointer;
    border: none;
  }

  .slider-value {
    font-size: 13px;
    color: var(--text-subtle);
    min-width: 36px;
    text-align: center;
  }



  /* ── LOGO ── */
  .logo {
    color: var(--text-bright);
    position: absolute;
    top: 40px;
    left: 30px;
  }

  .logo svg {
    height: 64px;
    width: auto;
  }

  /* ── CONTENT CONTAINER ── */
  #content {
    position: relative;
    margin-left: 220px;
    width: calc(100vw - 220px);
    min-height: 100vh;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

  <!-- Background layers -->
  <div class="bg-layer" id="bgLayer"></div>
  <div class="color-overlay" id="colorOverlay"></div>

  <!-- Sidebar navigation -->
  <nav class="sidebar">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1326 469">
        <path d="M 29 256 C 91 218, 155 183, 213 169 C 233 164, 252 164, 273 168 C 288 171, 300 175, 314 180" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 13"/>
        <path d="M 213 169 C 235 151, 252 133, 263 113 C 272 96, 276 76, 278 43" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 13"/>
        <text x="143" y="329" fill="currentColor" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="158" font-weight="700" letter-spacing="-5" textLength="1185" lengthAdjust="spacingAndGlyphs">authentic.me</text>
      </svg>
    </div>
    <a class="sidebar-card active" href="#/" data-route="/">
      <div class="sidebar-label">Introduction</div>
    </a>
    <a class="sidebar-card" href="#/how" data-route="/how">
      <div class="sidebar-label">How</div>
    </a>
    <a class="sidebar-card" href="#/needs" data-route="/needs">
      <div class="sidebar-label">Your Needs</div>
    </a>
    <a class="sidebar-card" href="#/program" data-route="/program">
      <div class="sidebar-label">The Program</div>
    </a>

    <!-- Footer: brand name, toggles theme picker -->
    <span class="sidebar-footer" id="themeToggle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3v18"/>
        <path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none"/>
      </svg>
    </span>
  </nav>

  <!-- Theme picker -->
  <div class="theme-backdrop" id="themeBackdrop"></div>
  <div class="theme-picker" id="themePicker">
    <div class="theme-picker-header" id="themePickerHeader">
      <span class="theme-picker-title">Theme</span>
      <span class="theme-picker-close" id="themePickerClose">&times;</span>
    </div>
    <div class="theme-reset" onclick="resetTheme()">Reset</div>
    <div class="theme-grid" id="themeGrid"></div>
    <div class="slider-control">
      <div class="slider-label">Filter</div>
      <input type="range" class="theme-range" id="overlayRange" min="0" max="100" value="94" oninput="setOverlayOpacity(this.value)">
      <div class="slider-value" id="overlayPct">94%</div>
    </div>
    <div class="slider-control">
      <div class="slider-label">Image</div>
      <input type="range" class="theme-range" id="bgRange" min="0" max="100" value="25" oninput="setBgOpacity(this.value)">
      <div class="slider-value" id="bgPct">25%</div>
    </div>
    <div class="bg-thumbs" id="bgThumbs"></div>
    <div class="text-mode-toggle">
      <button class="text-mode-btn active" data-mode="white" onclick="setTextMode('white')">A</button>
      <button class="text-mode-btn" data-mode="black" onclick="setTextMode('black')">A</button>
    </div>
  </div>

  <!-- Content container -->
  <div id="content"></div>

<script>
// ────────────────────────────────────────
// Theme colors: default teal + 12 hue-spaced
// ────────────────────────────────────────
var themeColors = [
  { r: 0,   g: 0,   b: 0,   name: 'Default' },      // black
  { r: 11,  g: 61,  b: 54,  name: 'Teal' },         // ~170 deg
  { r: 61,  g: 28,  b: 11,  name: 'Vermilion' },   // 30
  { r: 61,  g: 45,  b: 11,  name: 'Amber' },       // 60
  { r: 50,  g: 61,  b: 11,  name: 'Lime' },        // 90
  { r: 28,  g: 61,  b: 11,  name: 'Green' },       // 120
  { r: 11,  g: 61,  b: 28,  name: 'Emerald' },     // 150
  { r: 11,  g: 45,  b: 61,  name: 'Cyan' },        // 210
  { r: 11,  g: 28,  b: 61,  name: 'Blue' },        // 240
  { r: 28,  g: 11,  b: 61,  name: 'Indigo' },      // 270
  { r: 45,  g: 11,  b: 61,  name: 'Violet' },      // 300
  { r: 61,  g: 11,  b: 45,  name: 'Magenta' }      // 330
];

// ────────────────────────────────────────
// Background images
// ────────────────────────────────────────
var backgrounds = [
  { file: 'images/Background/ground_background.webp', name: 'Default' },
  { file: 'images/Background/Background1.png', name: 'Bg 1' },
  { file: 'images/Background/Background2.png', name: 'Bg 2' },
  { file: 'images/Background/Background3.png', name: 'Bg 3' },
  { file: 'images/Background/Background4.png', name: 'Bg 4' },
  { file: 'images/Background/Background5.png', name: 'Bg 5' },
  { file: 'images/Background/Background6.png', name: 'Bg 6' },
  { file: 'images/Background/Background7.png', name: 'Bg 7' },
  { file: 'images/Background/Background8.png', name: 'Bg 8' },
  { file: 'images/Background/Background9.png', name: 'Bg 9' }
];

// ────────────────────────────────────────
// DOM references
// ────────────────────────────────────────
var bgLayer = document.getElementById('bgLayer');
var colorOverlay = document.getElementById('colorOverlay');
var themePicker = document.getElementById('themePicker');
var themeGrid = document.getElementById('themeGrid');

// ────────────────────────────────────────
// State — load from localStorage
// ────────────────────────────────────────
var state = {
  themeIndex: parseInt(localStorage.getItem('am_theme') || '0'),
  textMode: localStorage.getItem('am_text_mode') || 'white',
  overlayOpacity: parseInt(localStorage.getItem('am_overlay_opacity') || '94'),
  bgOpacity: parseInt(localStorage.getItem('am_bg_opacity') || '25'),
  bgIndex: parseInt(localStorage.getItem('am_bg') || '0')
};

// ────────────────────────────────────────
// Theme color swatches
// ────────────────────────────────────────
themeColors.forEach(function(color, i) {
  var swatch = document.createElement('div');
  swatch.className = 'theme-swatch' + (i === state.themeIndex ? ' active' : '');
  swatch.style.background = 'rgb(' + color.r + ',' + color.g + ',' + color.b + ')';
  swatch.setAttribute('data-index', i);
  swatch.addEventListener('click', function() { setThemeColor(i); });
  themeGrid.appendChild(swatch);
});

// ────────────────────────────────────────
// Theme color
// ────────────────────────────────────────
function setThemeColor(index) {
  state.themeIndex = index;
  var c = themeColors[index];
  document.documentElement.style.setProperty('--overlay-color', 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')');
  localStorage.setItem('am_theme', index);

  // Update active swatch
  document.querySelectorAll('.theme-swatch').forEach(function(el, i) {
    el.classList.toggle('active', i === index);
  });
}

// ────────────────────────────────────────
// Text mode (white / black)
// ────────────────────────────────────────
function setTextMode(mode) {
  state.textMode = mode;
  var base = mode === 'white' ? '255,255,255' : '0,0,0';
  document.documentElement.style.setProperty('--text-bright',  'rgba(' + base + ',1)');
  document.documentElement.style.setProperty('--text-visible', 'rgba(' + base + ',0.8)');
  document.documentElement.style.setProperty('--text-muted',   'rgba(' + base + ',0.5)');
  document.documentElement.style.setProperty('--text-subtle',  'rgba(' + base + ',0.3)');
  document.documentElement.style.setProperty('--text-ghost',   'rgba(' + base + ',0.08)');
  localStorage.setItem('am_text_mode', mode);

  // Update toggle buttons
  document.querySelectorAll('.text-mode-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
  });
}

// ────────────────────────────────────────
// Overlay opacity
// ────────────────────────────────────────
function setOverlayOpacity(val) {
  state.overlayOpacity = parseInt(val);
  colorOverlay.style.opacity = state.overlayOpacity / 100;
  document.getElementById('overlayPct').textContent = state.overlayOpacity + '%';
  document.getElementById('overlayRange').value = state.overlayOpacity;
  localStorage.setItem('am_overlay_opacity', state.overlayOpacity);
}

// ────────────────────────────────────────
// Background image opacity
// ────────────────────────────────────────
function setBgOpacity(val) {
  state.bgOpacity = parseInt(val);
  bgLayer.style.opacity = state.bgOpacity / 100;
  document.getElementById('bgPct').textContent = state.bgOpacity + '%';
  document.getElementById('bgRange').value = state.bgOpacity;
  localStorage.setItem('am_bg_opacity', state.bgOpacity);
}

// ────────────────────────────────────────
// Background image selector (thumbnails)
// ────────────────────────────────────────
var bgThumbs = document.getElementById('bgThumbs');

function buildBgThumbs() {
  bgThumbs.innerHTML = '';
  backgrounds.forEach(function(bg, i) {
    var thumb = document.createElement('div');
    thumb.className = 'bg-thumb' + (i === state.bgIndex ? ' active' : '');
    thumb.style.backgroundImage = "url('" + bg.file + "')";
    thumb.addEventListener('click', function() { selectBg(i); });
    bgThumbs.appendChild(thumb);
  });
}

function selectBg(index) {
  state.bgIndex = index;
  bgLayer.style.backgroundImage = "url('" + backgrounds[index].file + "')";
  localStorage.setItem('am_bg', index);
  document.querySelectorAll('.bg-thumb').forEach(function(el, i) {
    el.classList.toggle('active', i === index);
  });
}

function applyBg() {
  bgLayer.style.backgroundImage = "url('" + backgrounds[state.bgIndex].file + "')";
  localStorage.setItem('am_bg', state.bgIndex);
}

buildBgThumbs();

// ────────────────────────────────────────
// Theme picker modal
// ────────────────────────────────────────
var themeBackdrop = document.getElementById('themeBackdrop');

function openThemePicker() {
  themePicker.classList.add('open');
  themeBackdrop.classList.add('open');
}

function closeThemePicker() {
  themePicker.classList.remove('open');
  themeBackdrop.classList.remove('open');
}

document.getElementById('themeToggle').addEventListener('click', function() {
  if (themePicker.classList.contains('open')) closeThemePicker();
  else openThemePicker();
});

document.getElementById('themePickerClose').addEventListener('click', closeThemePicker);
themeBackdrop.addEventListener('click', closeThemePicker);

// Dragging
var dragHeader = document.getElementById('themePickerHeader');
var isDragging = false;
var dragOffsetX = 0, dragOffsetY = 0;

dragHeader.addEventListener('mousedown', function(e) {
  if (e.target.id === 'themePickerClose') return;
  isDragging = true;
  var rect = themePicker.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  themePicker.style.transform = 'none';
  themePicker.style.left = rect.left + 'px';
  themePicker.style.top = rect.top + 'px';
  e.preventDefault();
});

document.addEventListener('mousemove', function(e) {
  if (!isDragging) return;
  themePicker.style.left = (e.clientX - dragOffsetX) + 'px';
  themePicker.style.top = (e.clientY - dragOffsetY) + 'px';
});

document.addEventListener('mouseup', function() {
  isDragging = false;
});

// ────────────────────────────────────────
// ────────────────────────────────────────
// Reset to defaults
// ────────────────────────────────────────
function resetTheme() {
  setThemeColor(0);
  setTextMode('white');
  setOverlayOpacity(94);
  setBgOpacity(25);
  selectBg(0);
}

// Apply saved state on load
// ────────────────────────────────────────
setThemeColor(state.themeIndex);
setTextMode(state.textMode);
setOverlayOpacity(state.overlayOpacity);
setBgOpacity(state.bgOpacity);
applyBg();

// ────────────────────────────────────────
// Router
// ────────────────────────────────────────
var navLinks = document.querySelectorAll('.sidebar-card[data-route]');

function getRoute() {
  var hash = window.location.hash || '#/';
  // Strip the leading #
  return hash.substring(1) || '/';
}

function matchRoute(route) {
  // Returns { name, params } for the matched route
  if (route === '/' || route === '') return { name: 'intro', params: {} };
  if (route === '/how') return { name: 'how', params: {} };
  if (route === '/needs') return { name: 'needs', params: {} };
  if (route === '/program') return { name: 'program', params: {} };

  // /how/:dimension
  var howMatch = route.match(/^\/how\/([^\/]+)$/);
  if (howMatch) return { name: 'how-dimension', params: { dimension: howMatch[1] } };

  // /needs/:parent
  var needsParent = route.match(/^\/needs\/([^\/]+)$/);
  if (needsParent) return { name: 'needs-parent', params: { parent: needsParent[1] } };

  // /needs/:parent/:child
  var needsChild = route.match(/^\/needs\/([^\/]+)\/([^\/]+)$/);
  if (needsChild) return { name: 'needs-child', params: { parent: needsChild[1], child: needsChild[2] } };

  return { name: 'intro', params: {} };
}

function updateNav(route) {
  // Determine which top-level nav item to highlight
  var activeRoute = '/';
  if (route.startsWith('/how')) activeRoute = '/how';
  else if (route.startsWith('/needs')) activeRoute = '/needs';
  else if (route.startsWith('/program')) activeRoute = '/program';

  navLinks.forEach(function(link) {
    var linkRoute = link.getAttribute('data-route');
    link.classList.toggle('active', linkRoute === activeRoute);
  });
}

function onRouteChange() {
  var route = getRoute();
  var match = matchRoute(route);
  updateNav(route);
  console.log('[router]', route, match);
}

window.addEventListener('hashchange', onRouteChange);
onRouteChange();
</script>
</body>
</html>
